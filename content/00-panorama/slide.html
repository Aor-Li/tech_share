<!doctype html>
<!--
  Chapter 00 — 全景地图开场页 (panorama opening).
  Outline: content.md (same directory)
  Layout:  one scrollable page per chapter — see content/_template.html.
  Nodes carry data-goto so that, once merged into index.html, clicking a node
  jumps to the matching chapter slide (handled by nav.js).
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>AI Infra 分享 — 全景地图</title>
  <link rel="stylesheet" href="../theme.css" />
</head>
<body>
  <div class="deck">
    <section class="slide">
      <p class="slide-kicker">开场 · Panorama</p>
      <div class="slide-eyebrow-rule"></div>
      <h2 class="slide-title slide-title--hero">全景地图</h2>

      <div class="slide-body" style="max-width: none;">
        <div class="chapter-section">
          <svg class="chart" viewBox="0 0 1200 300" width="100%" height="300" role="img"
               aria-label="全景地图：开场、性能估计、通讯原语、序列并行、并行范式、显存优化、真实部署 七节点流程图，节点沿一条渐升的天际线排列，点击节点可跳转到对应章节">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)" />
              </marker>
              <linearGradient id="pano-gradient" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="var(--accent)" />
                <stop offset="100%" stop-color="var(--accent-2)" />
              </linearGradient>
              <filter id="node-glow" x="-80%" y="-80%" width="260%" height="260%">
                <feGaussianBlur stdDeviation="7" />
              </filter>
            </defs>

            <!-- signature: a rising skyline path connects all seven stops -->
            <path class="pano-path"
                  d="M70,170 C159,170 159,132 248,132 C337,132 337,152 426,152 C515,152 515,96 604,96 C693,96 693,124 782,124 C871,124 871,78 960,78 C1049,78 1049,54 1138,54"
                  fill="none" stroke="url(#pano-gradient)" stroke-width="2.5" stroke-linecap="round"
                  stroke-dasharray="1600" stroke-dashoffset="0" marker-end="url(#arrow)" />

            <!-- node 0: current page -->
            <g class="pano-node">
              <circle class="pano-current-glow" cx="70" cy="170" r="30" fill="var(--accent)" filter="url(#node-glow)" />
              <circle cx="70" cy="170" r="21" fill="var(--accent)" stroke="var(--accent)" stroke-width="2" />
              <text class="chart-label-strong" x="70" y="216" text-anchor="middle">全景地图</text>
              <text class="chart-label" x="70" y="234" text-anchor="middle">你在这里</text>
            </g>

            <!-- node 1 -->
            <g class="pano-node pano-node--link" data-goto="1" role="link" tabindex="0" aria-label="跳转到 ① 性能估计">
              <rect x="178" y="102" width="140" height="106" fill="transparent" />
              <circle class="pano-ring" cx="248" cy="132" r="18" fill="var(--bg)" stroke="var(--accent-2)" stroke-width="2" />
              <text class="chart-index" x="248" y="132" dy="0.35em" text-anchor="middle">①</text>
              <text class="chart-label-strong" x="248" y="178" text-anchor="middle">性能估计</text>
              <text class="chart-label" x="248" y="196" text-anchor="middle">显存 / 算力</text>
            </g>

            <!-- node 2 -->
            <g class="pano-node pano-node--link" data-goto="2" role="link" tabindex="0" aria-label="跳转到 ② 通讯原语">
              <rect x="356" y="122" width="140" height="106" fill="transparent" />
              <circle class="pano-ring" cx="426" cy="152" r="18" fill="var(--bg)" stroke="var(--accent-2)" stroke-width="2" />
              <text class="chart-index" x="426" y="152" dy="0.35em" text-anchor="middle">②</text>
              <text class="chart-label-strong" x="426" y="198" text-anchor="middle">通讯原语</text>
              <text class="chart-label" x="426" y="216" text-anchor="middle">all-reduce 等</text>
            </g>

            <!-- node 3: sequence parallelism, the bridge — visual peak of this segment -->
            <g class="pano-node pano-node--link" data-goto="3" role="link" tabindex="0" aria-label="跳转到 ③ 序列维并行">
              <rect x="534" y="66" width="140" height="106" fill="transparent" />
              <circle class="pano-ring" cx="604" cy="96" r="18" fill="var(--bg)" stroke="var(--accent-2)" stroke-width="2" />
              <text class="chart-index" x="604" y="96" dy="0.35em" text-anchor="middle">③</text>
              <text class="chart-label-strong" x="604" y="142" text-anchor="middle">序列维并行</text>
              <text class="chart-label" x="604" y="160" text-anchor="middle">Ulysses / Ring</text>
            </g>

            <!-- node 4 -->
            <g class="pano-node pano-node--link" data-goto="4" role="link" tabindex="0" aria-label="跳转到 ④ 训练并行范式">
              <rect x="712" y="94" width="140" height="106" fill="transparent" />
              <circle class="pano-ring" cx="782" cy="124" r="18" fill="var(--bg)" stroke="var(--accent-2)" stroke-width="2" />
              <text class="chart-index" x="782" y="124" dy="0.35em" text-anchor="middle">④</text>
              <text class="chart-label-strong" x="782" y="170" text-anchor="middle">训练并行范式</text>
              <text class="chart-label" x="782" y="188" text-anchor="middle">DP/TP/PP/EP</text>
            </g>

            <!-- node 5 -->
            <g class="pano-node pano-node--link" data-goto="5" role="link" tabindex="0" aria-label="跳转到 ⑤ 显存与计算优化">
              <rect x="890" y="48" width="140" height="106" fill="transparent" />
              <circle class="pano-ring" cx="960" cy="78" r="18" fill="var(--bg)" stroke="var(--accent-2)" stroke-width="2" />
              <text class="chart-index" x="960" y="78" dy="0.35em" text-anchor="middle">⑤</text>
              <text class="chart-label-strong" x="960" y="124" text-anchor="middle">显存与计算优化</text>
              <text class="chart-label" x="960" y="142" text-anchor="middle">checkpoint / offload</text>
            </g>

            <!-- node 6: closing — highest point of the skyline -->
            <g class="pano-node pano-node--link" data-goto="6" role="link" tabindex="0" aria-label="跳转到 真实部署">
              <rect x="1068" y="24" width="132" height="106" fill="transparent" />
              <circle class="pano-ring" cx="1138" cy="54" r="18" fill="var(--bg)" stroke="var(--accent-2)" stroke-width="2" />
              <text class="chart-index" x="1138" y="54" dy="0.35em" text-anchor="middle">⑥</text>
              <text class="chart-label-strong" x="1138" y="100" text-anchor="middle">真实部署</text>
              <text class="chart-label" x="1138" y="118" text-anchor="middle">Philoflow / minimax</text>
            </g>

            <!-- dependency captions under the segments -->
            <text class="chart-caption" x="159" y="280" text-anchor="middle">先算清代价</text>
            <text class="chart-caption" x="337" y="280" text-anchor="middle">通讯的特化应用</text>
            <text class="chart-caption" x="515" y="280" text-anchor="middle">通讯 → 并行范式的桥</text>
            <text class="chart-caption" x="693" y="280" text-anchor="middle">范式选定后</text>
            <text class="chart-caption" x="871" y="280" text-anchor="middle">再省显存/算力</text>
            <text class="chart-caption" x="1049" y="280" text-anchor="middle">组合成真实系统</text>
          </svg>
          <p class="pano-hint">点击图中任意节点，直接跳到对应章节 · 或用 ← → 翻页</p>
        </div>
      </div>
    </section>
  </div>

  <div class="page-indicator" id="page-indicator"></div>
  <div class="deck-nav-hint">← → 翻页 · 点击节点跳章</div>

  <script src="../nav.js"></script>
</body>
</html>
