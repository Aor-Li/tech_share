<!doctype html>
<!--
  Section slide template.

  To start a new section, create `content/NN-<slug>/` and copy this file to
  `content/NN-<slug>/slide.html`, alongside a `content.md` holding the same
  section's Markdown outline. The `../theme.css` / `../nav.js` links below
  assume the file sits one level deep (content/NN-<slug>/), so they resolve
  to content/theme.css + content/nav.js. Keep the structure intact so the
  section:
    - renders correctly when opened standalone in a browser (this file), and
    - merges into the root `index.html` by copying only the single
      <section class="slide"> element below (no CSS/JS changes needed — the
      merged deck shares the exact same theme.css + nav.js, inlined once at
      the top of index.html).

  Layout convention: one section = one scrollable page = one <section
  class="slide">. Each sub-topic within the section becomes a
  <div class="chapter-section"> stacked inside the slide body (divided by a
  rule, headed by .chapter-section-title), not a separate <section class="slide">.
  Keyboard ←/→ moves between sections; mouse wheel/trackpad scrolls within
  the current section's page.

  Do not add per-section CSS overrides. All styling must come from
  content/theme.css so the merged deck has zero style divergence between
  sections. If a new component class is genuinely needed, add it to
  theme.css, not here.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>AI Infra 分享 — 章节草稿</title>
  <link rel="stylesheet" href="../theme.css" />
</head>
<body>
  <div class="deck">
    <section class="slide">
      <p class="slide-kicker">章节标签 Chapter Label</p>
      <div class="slide-eyebrow-rule"></div>
      <h2 class="slide-title">章节标题（首现英文术语 <span class="term">term</span>）</h2>

      <div class="slide-body" style="max-width: none;">
        <div class="chapter-section">
          <h3 class="chapter-section-title">第一个子话题标题</h3>
          <p>直觉说明，先给图/例子再收口到公式。量级数字用 <span class="num">1.23</span> 这样的样式突出。</p>
        </div>

        <!-- Add more <div class="chapter-section"> blocks for each sub-topic. -->
      </div>
    </section>
  </div>

  <div class="page-indicator" id="page-indicator"></div>
  <div class="deck-nav-hint">← → 翻页 · 滚动查看本页全部内容</div>

  <script src="../nav.js"></script>
</body>
</html>
